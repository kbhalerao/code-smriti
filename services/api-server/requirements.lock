# Resolved from requirements.txt, constrained to the versions the production
# image was running on 2026-10-22, minus what only torch/sentence-transformers
# needed. requirements.txt is mostly unpinned, so installing from it directly
# drifts the whole stack on every build (a fresh resolve that day picked
# pydantic-ai 0.2.4 and could not import the app). The Dockerfile installs this.
#
# Regenerate (python 3.11 to match the image):
#   uv pip compile requirements.txt --python-version 3.11 --no-header \
#       --no-annotate -c <pip freeze from the running image> -o requirements.lock
