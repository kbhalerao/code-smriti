[project]
name = "smriti-client"
version = "0.1.0"
description = "Async HTTP client for the CodeSmriti RAG API, shared by the MCP server and CLI"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smriti_client"]
