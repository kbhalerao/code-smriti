events {
    worker_connections 1024;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Real client IP recovery.
    # Colima publishes the host ports by NAT'ing through the Docker bridge, so
    # every request arrives with $remote_addr = 172.28.0.1 (the bridge gateway)
    # regardless of origin. Without this, access rules below cannot tell the LAN
    # from the internet, and the access log is a single indistinguishable client.
    # Only the bridge is trusted, so a client-supplied XFF cannot forge an origin:
    # recursive resolution walks right-to-left and stops at the first untrusted hop.
    set_real_ip_from 172.28.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Logging. $http_x_forwarded_for is kept alongside the resolved $remote_addr
    # so it stays visible whether the edge proxy is forwarding the header at all.
    # $host is load-bearing here, not decoration: this gateway serves several
    # vhosts on one port, and gzip makes $body_bytes_sent useless for telling
    # them apart, so without it a log line cannot be attributed to a site.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" host="$host" xff="$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Prompt-body capture for /llm/. Ollama logs method/path/latency only and has
    # no equivalent of LM Studio's log tail, so "which client sent this prompt" is
    # otherwise unanswerable. Attribution is the point: xff + ua together separate
    # the callers that share an egress address (several AI-SDK deployments do).
    #
    # escape=json makes the line valid JSON even though prompts contain quotes and
    # newlines, so this is tailable through jq. $content_length is quoted because
    # it is EMPTY on a chunked request, which unquoted would emit `"len":,`.
    #
    # Never add $http_x_smriti_key here — see the map block below for why.
    #
    # This log holds full prompt text, i.e. whatever the caller sent, including
    # email bodies via scriven. It stays inside the container (no volume) so it
    # cannot land in this public repo, and is discarded on container recreate.
    log_format llmbody escape=json
        '{"t":"$time_iso8601","addr":"$remote_addr","xff":"$http_x_forwarded_for",'
        '"ua":"$http_user_agent","uri":"$request_uri","len":"$content_length",'
        '"status":$status,"took":$request_time,"body":"$request_body"}';

    # Trusted sources for the inference endpoints. The LLM runs on the host GPU
    # with no authentication of its own, so reachability *is* the access control.
    # Deliberately fail-closed: 172.28.0.0/16 (the Docker bridge) is NOT listed.
    # An unresolved client — meaning the edge proxy did not send X-Forwarded-For —
    # keeps $remote_addr = 172.28.0.1 and is denied rather than silently trusted,
    # which is what an internet client would look like in that case. Nothing inside
    # the compose network needs this route: api-server reaches Ollama directly via
    # OLLAMA_HOST=http://host.docker.internal:11434 (docker-compose.yml:48), and the
    # host-side ingestion worker uses LLM_BASE_URL=http://localhost:11434.
    # Must precede every `map` in this file. nginx fixes the bucket size when it
    # meets the first map and then rejects this as a duplicate, so adding a map
    # above it takes the whole gateway down — every vhost, not just the one
    # being edited.
    #
    # A 64-char hex secret plus map overhead exceeds the default 64-byte bucket,
    # and nginx refuses to start with `could not build map_hash`. Must be a
    # power of two; raise this before lengthening the secret.
    map_hash_bucket_size 128;

    # LAN only, with no off-LAN escape hatch. Deliberately NOT $llm_allowed:
    # that variable includes allowlist.conf, which names third-party production
    # infrastructure, and pairs with a shared secret. Both are correct for
    # inference endpoints and wrong for a page that lists client repository
    # names and their commit counts.
    geo $lan_only {
        default        0;
        192.168.0.0/16 1;  # LAN + all VLANs
        127.0.0.0/8    1;
    }

    # Reaching this host directly by its internal name does not go through the
    # edge proxy, so there is no X-Forwarded-For and Colima's NAT makes every
    # client look like 172.28.0.1. The LAN check above cannot see who is asking,
    # so the internal hostname is accepted as its own condition.
    #
    # Host is client-supplied and therefore forgeable. This vhost is also the
    # default server, so a forged Host reaches it. That is acceptable only
    # because arriving here at all requires either LAN access or the edge proxy
    # choosing to forward an unrecognised Host — if that proxy is ever configured
    # to pass arbitrary Host values through, this condition stops meaning
    # anything and the IP check becomes the only real control.
    map $host $kpi_host_ok {
        default              0;
        macstudio.home.arpa  1;
    }

    map $lan_only$kpi_host_ok $kpi_allowed {
        default  1;   # either condition satisfied
        "00"     0;   # neither
    }

    geo $llm_allowed {
        default        0;
        192.168.0.0/16 1;  # LAN + all VLANs (10 edge, 11 host, 1 legacy/wifi)
        127.0.0.0/8    1;

        # Individual off-LAN callers are deployment data, not source: they name
        # third-party production infrastructure and this repo is public. They
        # live in llm-allowlist.d/allowlist.conf, which is gitignored and
        # mounted in; copy allowlist.conf.example to create it.
        #
        # The filename is fixed, not a glob: `include` inside a geo block is
        # handled by the geo parser, which opens the path literally and does
        # NOT expand wildcards. A glob here fails startup with
        # `open() ".../*.conf" failed (2: No such file or directory)`.
        # A missing file is likewise fatal — deliberately loud, since silently
        # dropping the allowlist would look identical to the 403 outage it fixes.
        include /etc/nginx/llm-allowlist.d/allowlist.conf;
    }

    # Shared secret for off-LAN callers, so access does not depend on an egress
    # address staying put. The secret lives in llm-allowlist.d/llm-key.conf
    # (gitignored, mounted in; copy llm-key.conf.example). Same fixed-filename
    # rule as the geo include above — map's include is also parsed by its own
    # module and does not expand wildcards, and a missing file is fatal.
    #
    # The value is hex, which sidesteps map's case-insensitive matching: there
    # is only one canonical spelling, so no entropy is lost to case folding.
    # Never add $http_x_smriti_key to log_format — it would write the secret to
    # a log that is far more widely readable than this config.
    map $http_x_smriti_key $llm_key_ok {
        default 0;
        include /etc/nginx/llm-allowlist.d/llm-key.conf;
    }

    # A caller passes on trusted network OR valid secret — not both. The LAN
    # keeps working without a key so local tooling and the CLAUDE.md curl
    # recipes are unaffected, and a key works from anywhere, which is the whole
    # point: it survives the backend's egress IP changing.
    map $llm_allowed$llm_key_ok $llm_pass {
        default 1;
        "00"    0;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss text/html;

    # Upstream servers
    upstream api_server {
        server api-server:8000;
    }

    upstream cos_web {
        server cos-web:3000;
    }

    upstream couchbase {
        server couchbase:8091;
    }

    upstream llm {
        server host.docker.internal:11434;
    }

    upstream reranker {
        server host.docker.internal:11435;
    }

    upstream cos_api {
        server host.docker.internal:8001;
    }

    # smriti.agsci.com - Landing page + API
    server {
        listen 80;
        server_name smriti.agsci.com localhost;

        # Health check endpoint
        location /health {
            proxy_pass http://api_server/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Chief of Staff API moved to chief-of-staff repo - routed by external nginx

        # API endpoints (main api-server)
        location /api/ {
            proxy_pass http://api_server/api/;
            proxy_http_version 1.1;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward Authorization header for JWT auth
            proxy_set_header Authorization $http_authorization;

            # Timeouts for long-running LLM requests
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # RAG pipeline endpoints (longer timeout for multi-step processing)
        location /api/rag/ask {
            proxy_pass http://api_server/api/rag/ask;
            proxy_http_version 1.1;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            # Extended timeouts for intent classification + retrieval + synthesis
            proxy_connect_timeout 180s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # FastAPI docs endpoints
        location /docs {
            proxy_pass http://api_server/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /redoc {
            proxy_pass http://api_server/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass http://api_server/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ollama endpoints (OpenAI-compatible).
        # Posture: read + inference only, trusted networks only. Ollama ships NO
        # auth, so the catalog-mutating verbs must not be reachable through the
        # gateway — they are performed locally via the ollama CLI only. Guards:
        #   1. callers must be on a trusted network or present the shared secret
        #      ($llm_pass — see the geo and map blocks), and
        #   2. the mutation paths (delete/create/copy/pull/push/blobs) 404, and
        #   3. the DELETE method is dropped outright (no read/inference path uses it).
        location /llm/ {
            if ($llm_pass = 0) { return 403; }

            # Model-catalog mutation. 404 (not 403) so the endpoints aren't advertised.
            location ~* ^/llm/api/(delete|create|copy|pull|push|blobs) {
                return 404;
            }
            limit_except GET HEAD POST OPTIONS { deny all; }

            # Prompt capture (see the llmbody format above). BOTH lines are needed:
            # an access_log in a nested context REPLACES the inherited one rather
            # than adding to it, so without re-declaring `main` here every /llm/
            # request would silently disappear from the main access log.
            #
            # $request_body is only populated while the body is in memory; a body
            # that spills to a temp file logs as empty. client_max_body_size is
            # unset here, so the 1m default caps the body — matching the buffer to
            # it means no request can spill, and none can grow the buffer past 1m.
            access_log /var/log/nginx/access.log main;
            access_log /var/log/nginx/llm-bodies.log llmbody;
            client_body_buffer_size 1m;

            proxy_pass http://llm/;
            proxy_http_version 1.1;

            # Ollama refuses any request whose Host is not loopback (its built-in
            # DNS-rebinding guard) — forwarding $host made every request through a
            # real hostname 403. Send the literal upstream authority instead. This
            # is the ONLY thing that was gating external access, so it must not be
            # relaxed without the $llm_pass check above staying in place.
            proxy_set_header Host localhost:11434;

            # Do not forward the shared secret upstream. Ollama has no use for it
            # and would echo it into its own logs.
            proxy_set_header X-Smriti-Key "";

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running LLM requests
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Disable buffering for streaming responses
            proxy_buffering off;
        }

        # Reranker endpoint (llama-server cross-encoder, bge-reranker-v2-m3 on host :11435)
        # Exact match wins over the /llm/ prefix, so this one path routes to the
        # reranker (:11435) while all other /llm/* paths stay on Ollama (:11434).
        # POST /llm/rerank  ->  {"query": "...", "documents": [...], "top_n": N}
        # Being an exact-match sibling of /llm/ rather than nested inside it, this
        # block inherits none of that block's guards — it needs its own.
        location = /llm/rerank {
            if ($llm_pass = 0) { return 403; }

            proxy_pass http://reranker/rerank;
            proxy_http_version 1.1;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Smriti-Key "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for scoring large document batches
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_buffering off;
        }

        # The KPI dashboard is generated into the same directory as the public
        # brief by scripts/generate_kpi.py, but unlike the brief it was never
        # sanitised: it tabulates repository names and commit counts, which are
        # client identities and relative activity. It regenerates daily, so
        # removing it once would not keep it removed.
        #
        # 404 rather than 403 — off-LAN callers have no need to learn it exists.
        location = /kpi.html {
            if ($kpi_allowed = 0) { return 404; }
            root /usr/share/nginx/html;
        }

        # Landing page (static files)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }

        # Couchbase Web UI (optional, for development)
        # location /couchbase/ {
        #    proxy_pass http://couchbase/;
        #    proxy_set_header Host $host;
        #    proxy_set_header X-Real-IP $remote_addr;
        #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #    proxy_set_header X-Forwarded-Proto $scheme;
        #}
    }

    # cos.agsci.com - Chief of Staff Web UI
    server {
        listen 80;
        server_name cos.agsci.com;

        # CoS API endpoints (only /api/cos/*, let /api/auth/* pass to SvelteKit)
        location /api/cos/ {
            proxy_pass http://cos_api/api/cos/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Proxy everything else to cos-web SvelteKit app
        location / {
            proxy_pass http://cos_web;
            proxy_http_version 1.1;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (for HMR in dev, SSE in prod)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts for LLM streaming responses
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Disable buffering for streaming
            proxy_buffering off;
        }
    }

    # HTTPS server (when SSL certificates are available)
    # Uncomment and configure when ready for production
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # Same location blocks as above
    #     location /mcp/ {
    #         proxy_pass http://mcp_server/mcp/;
    #         # ... same proxy settings
    #     }
    #
    #     location /api/ {
    #         proxy_pass http://mcp_server/api/;
    #         # ... same proxy settings
    #     }
    # }
}
