events {
    worker_connections 1024;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Real client IP recovery.
    # Colima publishes the host ports by NAT'ing through the Docker bridge, so
    # every request arrives with $remote_addr = 172.28.0.1 (the bridge gateway)
    # regardless of origin. Without this, access rules below cannot tell the LAN
    # from the internet, and the access log is a single indistinguishable client.
    # Only the bridge is trusted, so a client-supplied XFF cannot forge an origin:
    # recursive resolution walks right-to-left and stops at the first untrusted hop.
    set_real_ip_from 172.28.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Logging. $http_x_forwarded_for is kept alongside the resolved $remote_addr
    # so it stays visible whether the edge proxy is forwarding the header at all.
    # $host is load-bearing here, not decoration: this gateway serves several
    # vhosts on one port, and gzip makes $body_bytes_sent useless for telling
    # them apart, so without it a log line cannot be attributed to a site.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" host="$host" xff="$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Trusted sources for the inference endpoints. The LLM runs on the host GPU
    # with no authentication of its own, so reachability *is* the access control.
    # Deliberately fail-closed: 172.28.0.0/16 (the Docker bridge) is NOT listed.
    # An unresolved client — meaning the edge proxy did not send X-Forwarded-For —
    # keeps $remote_addr = 172.28.0.1 and is denied rather than silently trusted,
    # which is what an internet client would look like in that case. Nothing inside
    # the compose network needs this route: api-server reaches Ollama directly via
    # OLLAMA_HOST=http://host.docker.internal:11434 (docker-compose.yml:48), and the
    # host-side ingestion worker uses LLM_BASE_URL=http://localhost:11434.
    geo $llm_allowed {
        default        0;
        192.168.0.0/16 1;  # LAN + all VLANs (10 edge, 11 host, 1 legacy/wifi)
        127.0.0.0/8    1;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss text/html;

    # Upstream servers
    upstream api_server {
        server api-server:8000;
    }

    upstream cos_web {
        server cos-web:3000;
    }

    upstream couchbase {
        server couchbase:8091;
    }

    upstream llm {
        server host.docker.internal:11434;
    }

    upstream reranker {
        server host.docker.internal:11435;
    }

    upstream cos_api {
        server host.docker.internal:8001;
    }

    # smriti.agsci.com - Landing page + API
    server {
        listen 80;
        server_name smriti.agsci.com localhost;

        # Health check endpoint
        location /health {
            proxy_pass http://api_server/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Chief of Staff API moved to chief-of-staff repo - routed by external nginx

        # API endpoints (main api-server)
        location /api/ {
            proxy_pass http://api_server/api/;
            proxy_http_version 1.1;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward Authorization header for JWT auth
            proxy_set_header Authorization $http_authorization;

            # Timeouts for long-running LLM requests
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # RAG pipeline endpoints (longer timeout for multi-step processing)
        location /api/rag/ask {
            proxy_pass http://api_server/api/rag/ask;
            proxy_http_version 1.1;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            # Extended timeouts for intent classification + retrieval + synthesis
            proxy_connect_timeout 180s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # FastAPI docs endpoints
        location /docs {
            proxy_pass http://api_server/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /redoc {
            proxy_pass http://api_server/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass http://api_server/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ollama endpoints (OpenAI-compatible).
        # Posture: read + inference only, trusted networks only. Ollama ships NO
        # auth, so the catalog-mutating verbs must not be reachable through the
        # gateway — they are performed locally via the ollama CLI only. Guards:
        #   1. non-LAN clients are refused ($llm_allowed, see the geo block), and
        #   2. the mutation paths (delete/create/copy/pull/push/blobs) 404, and
        #   3. the DELETE method is dropped outright (no read/inference path uses it).
        location /llm/ {
            if ($llm_allowed = 0) { return 403; }

            # Model-catalog mutation. 404 (not 403) so the endpoints aren't advertised.
            location ~* ^/llm/api/(delete|create|copy|pull|push|blobs) {
                return 404;
            }
            limit_except GET HEAD POST OPTIONS { deny all; }

            proxy_pass http://llm/;
            proxy_http_version 1.1;

            # Ollama refuses any request whose Host is not loopback (its built-in
            # DNS-rebinding guard) — forwarding $host made every request through a
            # real hostname 403. Send the literal upstream authority instead. This
            # is the ONLY thing that was gating external access, so it must not be
            # relaxed without the $llm_allowed check above staying in place.
            proxy_set_header Host localhost:11434;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running LLM requests
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Disable buffering for streaming responses
            proxy_buffering off;
        }

        # Reranker endpoint (llama-server cross-encoder, bge-reranker-v2-m3 on host :11435)
        # Exact match wins over the /llm/ prefix, so this one path routes to the
        # reranker (:11435) while all other /llm/* paths stay on Ollama (:11434).
        # POST /llm/rerank  ->  {"query": "...", "documents": [...], "top_n": N}
        # Being an exact-match sibling of /llm/ rather than nested inside it, this
        # block inherits none of that block's guards — it needs its own.
        location = /llm/rerank {
            if ($llm_allowed = 0) { return 403; }

            proxy_pass http://reranker/rerank;
            proxy_http_version 1.1;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for scoring large document batches
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_buffering off;
        }

        # Landing page (static files)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }

        # Couchbase Web UI (optional, for development)
        # location /couchbase/ {
        #    proxy_pass http://couchbase/;
        #    proxy_set_header Host $host;
        #    proxy_set_header X-Real-IP $remote_addr;
        #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #    proxy_set_header X-Forwarded-Proto $scheme;
        #}
    }

    # cos.agsci.com - Chief of Staff Web UI
    server {
        listen 80;
        server_name cos.agsci.com;

        # CoS API endpoints (only /api/cos/*, let /api/auth/* pass to SvelteKit)
        location /api/cos/ {
            proxy_pass http://cos_api/api/cos/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Proxy everything else to cos-web SvelteKit app
        location / {
            proxy_pass http://cos_web;
            proxy_http_version 1.1;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (for HMR in dev, SSE in prod)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts for LLM streaming responses
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Disable buffering for streaming
            proxy_buffering off;
        }
    }

    # HTTPS server (when SSL certificates are available)
    # Uncomment and configure when ready for production
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # Same location blocks as above
    #     location /mcp/ {
    #         proxy_pass http://mcp_server/mcp/;
    #         # ... same proxy settings
    #     }
    #
    #     location /api/ {
    #         proxy_pass http://mcp_server/api/;
    #         # ... same proxy settings
    #     }
    # }
}
