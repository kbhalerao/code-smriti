# Resolved from requirements.txt, constrained to the versions the production
# image was running on 2026-10-22, minus what only torch/sentence-transformers
# needed. requirements.txt is mostly unpinned, so installing from it directly
# drifts the whole stack on every build (a fresh resolve that day picked
# pydantic-ai 0.2.4 and could not import the app). The Dockerfile installs this.
#
# Regenerate (python 3.11 to match the image):
#   uv pip compile requirements.txt --python-version 3.11 --no-header \
#       --no-annotate -c <pip freeze from the running image> -o requirements.lock
#
# 2026-11-23 security refresh (trivy critical/high):
# - pydantic-ai -> pydantic-ai-slim[openai]. The agent only speaks the
#   OpenAI-compatible API to Ollama; the full package pulled every provider
#   SDK plus temporalio, mcp and fastmcp (154 -> 50 packages).
# - python-jose -> PyJWT. jose pins pyasn1<0.5 and pulls ecdsa, both with open
#   advisories. app/auth/utils.py keeps jose's lax sub/jti handling.
# - Every remaining flagged package lifted to its first fixed release, the rest
#   kept at their previous pins where the resolver allowed. Floors used:
#   authlib>=1.9.1 pyjwt>=2.14.0 aiohttp>=3.14.4 anyio>=4.14.2
#   certifi>=2026.10.18 cryptography>=50.0.0 dnspython>=2.9.2 fsspec>=2026.6.0
#   jaraco-context>=6.1.0 protobuf>=6.33.5 pyasn1>=0.6.5 python-multipart>=0.0.30
#   starlette>=1.3.1 urllib3>=2.8.0 zipp>=3.19.1 httpx2>=2.12.0
#   httpcore2>=2.10.0 wheel>=0.46.2
