[project]
name = "akriti-lora"
version = "0.1.0"
description = "LoRA fine-tuning pipeline for Akriti-aware language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlx-lm>=0.20.0",
    "couchbase>=4.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]
